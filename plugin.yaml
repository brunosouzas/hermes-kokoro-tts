name: kokoro-tts
version: 0.1.0
manifest_version: 2
api_version: 1
description: "Local Kokoro text-to-speech on Apple Silicon (MLX): tts.provider kokoro, 9 languages, sentence streaming, nothing leaves the machine."
author: "Bruno Souza (@brunosouzas)"
license: MIT
homepage: https://github.com/brunosouzas/hermes-kokoro-tts
tags: [tts, voice, local, mlx, kokoro, apple-silicon]
requires_hermes: ">=0.22.2"
platforms: [macos]
# The Kokoro server runs in its own virtual environment (built by `hermes kokoro install`);
# the plugin itself uses only the standard library inside Hermes.
python_runtime: external
external_dependencies:
  - name: uv
    check: "uv --version"
    install: "brew install uv"
provides_tools: []
provides_hooks: []
config_schema:
  voice:
    type: str
    default: af_heart
    label: Voice
    description: "Kokoro voice id, e.g. af_heart (US English), bf_emma (UK English), pf_dora (Brazilian Portuguese), ef_dora (Spanish). `hermes kokoro voices` lists them. tts.voice, when set, wins."
  language:
    type: str
    default: ""
    label: Language override
    description: "Leave empty to use the voice's own language (its first letter). Set a Kokoro code (a, b, e, f, h, i, j, p, z) to read text in another language with this voice."
  speed:
    type: float
    default: 1.0
    label: Speed
    description: "Speaking rate multiplier, 0.25 to 4.0."
  port:
    type: int
    default: 8770
    label: Server port
    description: "Loopback port of the local Kokoro server. Run `hermes kokoro install` again after changing it."
  service_dir:
    type: str
    default: ""
    label: Server directory
    description: "Where the server environment and model live. Empty = ~/Library/Application Support/hermes-kokoro-tts."
