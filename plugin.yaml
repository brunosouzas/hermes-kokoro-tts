name: kokoro-tts
version: 0.4.0
manifest_version: 2
api_version: 1
description: "Local Kokoro text-to-speech on Apple Silicon (MLX) and Linux (PyTorch on CPU): tts.provider kokoro-mlx, 9 languages, a voice per language (switches per sentence between Portuguese, English and Italian), a dictionary of English words the same voice pronounces in English, sentence streaming, nothing leaves the machine."
author: "Bruno Souza (@brunosouzas)"
license: MIT
homepage: https://github.com/brunosouzas/hermes-kokoro-tts
tags: [tts, voice, local, mlx, kokoro, apple-silicon, linux]
requires_hermes: ">=0.22.2"
platforms: [macos, linux]
# The Kokoro server runs in its own virtual environment (built by `hermes kokoro install`);
# the plugin itself uses only the standard library inside Hermes.
python_runtime: external
external_dependencies:
  - name: uv
    check: "uv --version"
    install: "macOS: brew install uv. Linux: pipx install uv, or see https://docs.astral.sh/uv/getting-started/installation/"
provides_tools: []
provides_hooks: []
config_schema:
  voice:
    type: str
    default: af_heart
    label: Voice
    description: "Kokoro voice id, e.g. af_heart (US English), bf_emma (UK English), pf_dora (Brazilian Portuguese), ef_dora (Spanish). `hermes kokoro voices` lists them. tts.voice, when set, wins."
  voices:
    type: dict
    default: {}
    label: Voice per language
    description: "Optional map from a detected language to a voice, e.g. {pt: pf_dora, en: bf_emma}. Each sentence is spoken by the voice of its language; sentences with no clear language keep the previous voice. Detects pt, en and it; other keys are ignored with a warning. Empty = always use `voice`. Ignored when tts.voice is set. Run `hermes kokoro install` again after changing it so the server loads these voices at start-up."
  english_words:
    type: list
    default: []
    label: English words
    description: "Words and short phrases a non-English voice should say in English, e.g. [pipeline, card, deploy, \"pull request\"]. The same voice keeps speaking; only these words get English pronunciation. Plurals with -s match too. Grow it as you listen: `hermes kokoro words add WORD`. Applies to the next reply, no restart."
  english_accent:
    type: str
    default: a
    label: Accent of English words
    description: "a = American, b = British pronunciation for english_words."
  language:
    type: str
    default: ""
    label: Language override
    description: "Leave empty to use the voice's own language (its first letter). Set a Kokoro code (a, b, e, f, h, i, j, p, z) to read text in another language with this voice. Single-voice mode only: ignored when `voices` is set."
  speed:
    type: float
    default: 1.0
    label: Speed
    description: "Speaking rate multiplier, 0.25 to 4.0."
  port:
    type: int
    default: 8770
    label: Server port
    description: "Loopback port of the local Kokoro server. Run `hermes kokoro install` again after changing it."
  service_dir:
    type: str
    default: ""
    label: Server directory
    description: "Where the server environment and model live. Empty = ~/Library/Application Support/hermes-kokoro-tts on macOS, ${XDG_DATA_HOME:-~/.local/share}/hermes-kokoro-tts on Linux."
